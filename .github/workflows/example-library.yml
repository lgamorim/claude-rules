name: example-library

# A separate workflow because `paths` filters a whole workflow, not a job:
# the library example's build, tests, and pack run only when the example or
# this file changes, while check.yml still runs on every push.
on:
  push:
    paths:
      - examples/library/**
      - .github/workflows/example-library.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example-library:
    # archetype/library.md: CI runs the TFM matrix on every OS the package
    # claims to support.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/library
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet build ContosoCsv.slnx
      - run: dotnet test ContosoCsv.slnx --no-build
      - run: dotnet format ContosoCsv.slnx --verify-no-changes
      - run: dotnet pack ContosoCsv.slnx
