name: check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # check.ps1 diffs from the merge base with master, so the job needs
          # master's history, not a shallow clone of the pushed commit.
          fetch-depth: 0
      - name: Check maintenance rules
        shell: pwsh
        run: ./tools/check.ps1 -Base origin/master

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/application
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ContosoOrders.slnx
      - run: dotnet test ContosoOrders.slnx --no-build
      - run: dotnet format ContosoOrders.slnx --verify-no-changes
